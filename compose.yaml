name: wechat-server

services:
  wechat-server:
    image: wechat-server:${WECHAT_IMAGE_TAG:-local}
    build:
      context: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SQLITE_PATH: /data/wechat-server.db
      UPLOAD_PATH: /data/upload
      SQL_DSN: ${SQL_DSN:-}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING:-}
    ports:
      - "127.0.0.1:${WECHAT_PORT:-13304}:3000"
    volumes:
      - ${WECHAT_DATA_DIR:-/opt/wechat-server/data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
